# SPEC CPU 2006 SimPoint runs: Sniper overrides
#
# Loaded after snipersim/config/riscv.cfg in run-sniper invocations from
# scripts/run_sniper_benchmark.sh, run_sniper_all_benchmark.sh,
# run_sift_single_simpoint.sh, run_full_benchmark_fifo.sh.
#
# Keep this file in the SPEC project repo (NOT in snipersim/) so that
# `make build_sniper` re-cloning snipersim does not wipe these overrides.

# --- HOOK_PERIODIC_INS granularity ---
# Default (base.cfg) is ins_global=1,000,000 / ins_per_core=10,000.
# That means roi-icount.py defers ROI start to the next periodic callback,
# which fires only after 1M instructions, so a 20M-detailed window loses
# 1M (~5%) and a 100M window loses 1M (~1%) of ROI coverage.
# Shrink to 10,000 / 100 to cap the loss at ~0.05% while keeping the
# original deferred-ROI mechanism intact (removing the deferral breaks
# the WARMUP -> DETAILED transition; see run-sniper test 2026-05-10).
[core/hook_periodic_ins]
ins_global = 10000
ins_per_core = 100
